<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VerityCompany - Super Mario Flash</title>
    <style>
        body { background-color: #0b0b0f; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #player { width: 100%; height: 100vh; }
    </style>
    <!-- 🚀 CDN Oficial de Ruffle reparada con la ruta de distribución completa en UNPKG -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="player"></div>

<script>
    window.addEventListener("DOMContentLoaded", () => {
        // Inicializamos el motor nativo desde el objeto global descargado
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        document.getElementById("player").appendChild(player);
        
        // 🎮 CONEXIÓN LOCAL SOBERANA:
        // Usamos '../' para salir de la carpeta 'juegos' y entrar directo en 'ruffle/' 
        // a jalar tu archivo super-mario-flash.swf recién creado
        player.load({
            url: "../ruffle/super-mario-flash.swf", 
            allowScriptAccess: true
        }).then(() => {
            console.log("¡Super Mario Flash cargado con éxito en los servidores de VerityCompany!");
        }).catch((err) => {
            console.error("Fallo de emulación:", err);
        });
    });
</script>

</body>
</html>
