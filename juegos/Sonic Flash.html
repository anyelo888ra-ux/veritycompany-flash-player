<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VerityCompany - Sonic Flash</title>
    <style>
        body { background-color: #0b0b0f; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #player { width: 100%; height: 100vh; }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="player"></div>

<script>
    window.addEventListener("DOMContentLoaded", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        document.getElementById("player").appendChild(player);
        
        player.load({
            url: "https://github.io", // Reemplazable por tu URL de Sonic
            allowScriptAccess: true
        });
    });
</script>

</body>
</html>
