<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerityCompany Flash Player v1.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Menú Lateral */
        #sidebar { width: 320px; background-color: #1e1e1e; border-right: 2px solid #333; display: flex; flex-direction: column; padding: 20px; }
        #sidebar h1 { font-size: 22px; color: #ff9900; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .author { font-size: 12px; color: #888; margin-bottom: 25px; }
        
        /* Zona de Pruebas (Test Studio) */
        .test-box { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #555; }
        .test-box h3 { font-size: 14px; color: #ff9900; margin-bottom: 8px; text-transform: uppercase; }
        .test-box input { width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; margin-bottom: 10px; font-size: 13px; }
        .play-btn { width: 100%; padding: 10px; background: #ff9900; border: none; color: #121212; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
        .play-btn:hover { background: #e08800; }

        /* Lista de Juegos Guardados */
        <h2>Catálogo</h2>
        .game-list { list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex-grow: 1; }
        .game-item { background: #2a2a2a; padding: 12px; border-radius: 6px; cursor: pointer; transition: background 0.2s; border-left: 4px solid transparent; }
        .game-item:hover { background: #3a3a3a; border-left: 4px solid #ff9900; }
        .game-item.active { background: #332200; border-left: 4px solid #ff9900; color: #ff9900; font-weight: bold; }

        /* Contenedor del Reproductor */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #141414; }
        #player-title { font-size: 24px; margin-bottom: 15px; color: #eee; }
        #player-container { width: 800px; height: 600px; background: #000; border: 4px solid #2d2d2d; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .placeholder-text { color: #555; font-size: 16px; text-align: center; line-height: 1.5; }
    </style>
    <!-- Cargando el emulador Ruffle directamente desde el CDN oficial -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <!-- MENÚ LATERAL -->
    <div id="sidebar">
        <h1>VerityCompany</h1>
        <div class="author">Flash Player por anyelo888ra-ux</div>
        
        <!-- ESTUDIO DE PRUEBAS INMEDIATAS -->
        <div class="test-box">
            <h3>Laboratorio de Pruebas</h3>
            <input type="text" id="url-input" placeholder="Ej: juegos/tujuego.swf o URL externa">
            <button class="play-btn" onclick="testCustomSWF()">▶️ Dar Play</button>
        </div>
        
        <h2>Lista de Éxitos</h2>
        <ul class="game-list">
            <li class="game-item" data-swf="juegos/juego1.swf" onclick="loadFlash(this, 'Super Mario Flash')">🕹️ Super Mario Flash</li>
            <li class="game-item" data-swf="juegos/juego2.swf" onclick="loadFlash(this, 'Sonic Flash')">🕹️ Sonic Flash</li>
        </ul>
    </div>

    <!-- ÁREA DEL REPRODUCTOR -->
    <div id="main-content">
        <h2 id="player-title">Estudio de carga VerityCompany</h2>
        <div id="player-container">
            <div class="placeholder-text">
                Sistema de Soporte Extendido listo.<br>
                Ingresa una ruta a la izquierda y presiona el botón "Play".
            </div>
        </div>
    </div>

    <!-- LÓGICA DE CONTROL JS -->
    <script>
        // Función 1: Carga desde la lista de catálogo
        function loadFlash(element, gameName) {
            document.querySelectorAll('.game-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            
            const swfPath = element.getAttribute('data-swf');
            document.getElementById('url-input').value = swfPath; // Sincroniza la barra de texto
            
            runRuffle(swfPath, gameName);
        }

        // Función 2: Ejecuta lo que el usuario escriba en la caja de texto y presione Play
        function testCustomSWF() {
            const path = document.getElementById('url-input').value.trim();
            if(path === "") {
                alert("Por favor escribe una ruta válida.");
                return;
            }
            // Extrae el nombre del archivo para mostrarlo como título
            const filename = path.substring(path.lastIndexOf('/') + 1);
            runRuffle(path, `Probando: ${filename}`);
        }

        // Función 3: Inyecta el objeto emulado en la pantalla
        function runRuffle(swfUrl, title) {
            document.getElementById('player-title').innerText = title;
            const container = document.getElementById('player-container');
            container.innerHTML = `<object data="${swfUrl}" width="100%" height="100%"></object>`;
        }
    </script>

</body>
</html>
